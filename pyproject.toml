[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hypercaptcha-eval"
version = "0.1.0"
description = "Offline dataset, labeling, recording, fitting, sweep, export, and summary toolkit for HyperCaptcha decision models."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
browser = [
    "playwright==1.62.0",
]
camoufox = [
    "camoufox==0.5.9",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
hypercaptcha-eval = "eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
