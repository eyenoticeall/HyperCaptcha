name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test, cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit, integration, and fixture parity tests
        run: cargo test --locked

      - name: Run offline CLI smoke checks
        shell: bash
        run: |
          shopt -s globstar
          cargo run --locked -- models >/dev/null
          cargo run --locked -- models --json >/dev/null
          cargo run --locked -- validate-config \
            models/recaptcha/**/*.toml \
            models/hcaptcha/**/*.toml \
            models/examples/custom-decision-model.toml

  python:
    name: Python (py_compile, scripts, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Syntax-check browser runner scripts
        run: uv run --extra browser python -m py_compile scripts/_common.py scripts/recaptcha_lab.py scripts/hcaptcha_lab.py

      - name: Check browser runner script imports and CLI help
        run: |
          uv run --extra browser python scripts/recaptcha_lab.py --help >/dev/null
          uv run --extra browser python scripts/hcaptcha_lab.py --help >/dev/null

      - name: Run offline evaluation and parity tests
        run: uv run --extra dev pytest -v
