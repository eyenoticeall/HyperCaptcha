name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit, integration, and fixture parity tests
        run: cargo test --locked

  python:
    name: Python (py_compile, scripts, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Syntax-check browser runner scripts
        run: uv run python -m py_compile scripts/chrome_lab.py scripts/camoufox_lab.py scripts/hcaptcha_lab.py

      - name: Check browser runner script imports and CLI help
        run: |
          uv run --extra browser python scripts/chrome_lab.py --help >/dev/null
          uv run --extra browser python scripts/hcaptcha_lab.py --help >/dev/null
          uv run --extra camoufox python scripts/camoufox_lab.py --help >/dev/null

      - name: Run offline evaluation and parity tests
        run: uv run --extra dev pytest -v
